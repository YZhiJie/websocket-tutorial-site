<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E1E33"/></marker>
  </defs>

  <!-- 标题横幅 -->
  <rect x="44" y="38" width="700" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#06B6D4">第一幕 · 服务器为什么不主动找我</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">实时通信进化史：短轮询 → 长轮询 / SSE → WebSocket</text>
  <!-- 信号装饰 -->
  <g transform="translate(1080,74)" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round">
    <path d="M -34 14 Q -10 -10 14 14"/>
    <path d="M -20 24 Q 0 8 20 24" stroke="#06B6D4"/>
    <circle cx="0" cy="30" r="5" fill="#8B5CF6" stroke="none"/>
  </g>

  <!-- ===== 格 1：短轮询 ===== -->
  <g>
    <rect x="44" y="134" width="352" height="516" rx="18" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="44" y="134" width="352" height="40" rx="18" fill="#F59E0B"/>
    <rect x="44" y="156" width="352" height="18" fill="#F59E0B"/>
    <text x="220" y="161" font-size="18" font-weight="bold" text-anchor="middle" fill="#0E1E33">① 短轮询：隔几秒问一次</text>

    <!-- 小浏（浏览器） -->
    <g transform="translate(118,210)">
      <rect x="-46" y="0" width="92" height="104" rx="14" fill="#DBEAFE" stroke="#0E1E33" stroke-width="3"/>
      <rect x="-46" y="0" width="92" height="22" rx="14" fill="#2563EB"/>
      <rect x="-46" y="12" width="92" height="10" fill="#2563EB"/>
      <circle cx="-30" cy="11" r="3.4" fill="#EF4444"/><circle cx="-18" cy="11" r="3.4" fill="#F59E0B"/><circle cx="-6" cy="11" r="3.4" fill="#10B981"/>
      <circle cx="-16" cy="52" r="4.5" fill="#0E1E33"/><circle cx="16" cy="52" r="4.5" fill="#0E1E33"/>
      <path d="M -12 74 Q 0 64 12 74" fill="none" stroke="#0E1E33" stroke-width="2.6" stroke-linecap="round"/>
      <text x="0" y="126" font-size="13" text-anchor="middle" fill="#0E1E33">小浏（浏览器）</text>
    </g>
    <!-- 服叔（机柜） -->
    <g transform="translate(312,210)">
      <rect x="-34" y="0" width="68" height="104" rx="10" fill="#CFFAFE" stroke="#0E1E33" stroke-width="3"/>
      <rect x="-24" y="14" width="48" height="8" rx="4" fill="#0E1E33"/>
      <rect x="-24" y="34" width="48" height="8" rx="4" fill="#0E1E33"/>
      <rect x="-24" y="54" width="48" height="8" rx="4" fill="#0E1E33"/>
      <circle cx="22" cy="86" r="5" fill="#10B981"/>
      <text x="0" y="126" font-size="13" text-anchor="middle" fill="#0E1E33">服叔（服务器）</text>
    </g>
    <!-- 反复问答箭头 -->
    <g stroke="#F59E0B" stroke-width="2.6" fill="none">
      <line x1="168" y1="244" x2="272" y2="244" marker-end="url(#ar)"/>
      <line x1="272" y1="272" x2="168" y2="272" marker-end="url(#ar)"/>
      <line x1="168" y1="300" x2="272" y2="300" marker-end="url(#ar)"/>
    </g>
    <text x="220" y="238" font-size="11.5" text-anchor="middle" fill="#0E1E33">有新消息吗？</text>
    <text x="220" y="266" font-size="11.5" text-anchor="middle" fill="#0E1E33">没有</text>
    <text x="220" y="294" font-size="11.5" text-anchor="middle" fill="#0E1E33">有吗？…还是没有</text>

    <!-- 废纸堆 -->
    <g transform="translate(220,380)">
      <rect x="-60" y="0" width="26" height="20" rx="3" fill="#E5E7EB" stroke="#0E1E33" stroke-width="1.6" transform="rotate(-12 -47 10)"/>
      <rect x="-28" y="-4" width="26" height="20" rx="3" fill="#E5E7EB" stroke="#0E1E33" stroke-width="1.6" transform="rotate(8 -15 6)"/>
      <rect x="4" y="2" width="26" height="20" rx="3" fill="#E5E7EB" stroke="#0E1E33" stroke-width="1.6" transform="rotate(-6 17 12)"/>
      <text x="0" y="66" font-size="12.5" text-anchor="middle" fill="#EF4444">大量空响应，平均延迟 N/2 秒</text>
    </g>
    <!-- 小浏累了 -->
    <text x="118" y="430" font-size="13" text-anchor="middle" fill="#0E1E33">每隔 N 秒举手，手都酸了</text>
    <!-- 结论气泡 -->
    <rect x="66" y="556" width="308" height="72" rx="12" fill="#FEF3C7" stroke="#0E1E33" stroke-width="2.4"/>
    <text x="220" y="584" font-size="13.5" text-anchor="middle" fill="#0E1E33">半双工 · 一问一答</text>
    <text x="220" y="608" font-size="13.5" text-anchor="middle" fill="#0E1E33">服务端再着急也没法主动开口</text>
  </g>

  <!-- ===== 格 2：长轮询 / SSE ===== -->
  <g>
    <rect x="424" y="134" width="352" height="516" rx="18" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="424" y="134" width="352" height="40" rx="18" fill="#8B5CF6"/>
    <rect x="424" y="156" width="352" height="18" fill="#8B5CF6"/>
    <text x="600" y="161" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">② 长轮询 / SSE：单行道</text>

    <g transform="translate(498,210)">
      <rect x="-46" y="0" width="92" height="104" rx="14" fill="#DBEAFE" stroke="#0E1E33" stroke-width="3"/>
      <rect x="-46" y="0" width="92" height="22" rx="14" fill="#2563EB"/>
      <rect x="-46" y="12" width="92" height="10" fill="#2563EB"/>
      <circle cx="-30" cy="11" r="3.4" fill="#EF4444"/><circle cx="-18" cy="11" r="3.4" fill="#F59E0B"/><circle cx="-6" cy="11" r="3.4" fill="#10B981"/>
      <circle cx="-16" cy="52" r="4.5" fill="#0E1E33"/><circle cx="16" cy="52" r="4.5" fill="#0E1E33"/>
      <path d="M -10 74 L 10 74" stroke="#0E1E33" stroke-width="2.6" stroke-linecap="round"/>
      <text x="0" y="126" font-size="13" text-anchor="middle" fill="#0E1E33">小浏</text>
    </g>
    <g transform="translate(692,210)">
      <rect x="-34" y="0" width="68" height="104" rx="10" fill="#CFFAFE" stroke="#0E1E33" stroke-width="3"/>
      <rect x="-24" y="14" width="48" height="8" rx="4" fill="#0E1E33"/>
      <rect x="-24" y="34" width="48" height="8" rx="4" fill="#0E1E33"/>
      <rect x="-24" y="54" width="48" height="8" rx="4" fill="#0E1E33"/>
      <circle cx="22" cy="86" r="5" fill="#10B981"/>
      <text x="0" y="126" font-size="13" text-anchor="middle" fill="#0E1E33">服叔</text>
    </g>
    <!-- 请求挂起 -->
    <line x1="548" y1="240" x2="652" y2="240" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#ar)"/>
    <text x="600" y="232" font-size="12" text-anchor="middle" fill="#0E1E33">请求挂起…有货才回</text>
    <!-- 单向推送流 -->
    <g stroke="#06B6D4" stroke-width="3" fill="none">
      <line x1="652" y1="286" x2="548" y2="286" marker-end="url(#ar)"/>
      <line x1="652" y1="312" x2="548" y2="312" marker-end="url(#ar)"/>
      <line x1="652" y1="338" x2="548" y2="338" marker-end="url(#ar)"/>
    </g>
    <text x="600" y="306" font-size="12.5" text-anchor="middle" fill="#0E1E33">SSE：服务端持续推文本</text>
    <!-- 单行道标志 -->
    <g transform="translate(600,402)">
      <rect x="-92" y="-26" width="184" height="52" rx="26" fill="#EDE9FE" stroke="#0E1E33" stroke-width="2.4"/>
      <text x="0" y="6" font-size="16" font-weight="bold" text-anchor="middle" fill="#7C3AED">→→→ 仅服务端 → 客户端</text>
    </g>
    <rect x="446" y="470" width="308" height="158" rx="12" fill="#F5F3FF" stroke="#0E1E33" stroke-width="2.4"/>
    <text x="600" y="500" font-size="13.5" text-anchor="middle" fill="#0E1E33">长轮询：延迟中、反复建连</text>
    <text x="600" y="528" font-size="13.5" text-anchor="middle" fill="#0E1E33">SSE：低频通知够用、自带重连</text>
    <text x="600" y="566" font-size="13.5" text-anchor="middle" fill="#0E1E33">但客户端想说话？</text>
    <text x="600" y="596" font-size="15" font-weight="bold" text-anchor="middle" fill="#EF4444">还得再开一条 HTTP 请求</text>
  </g>

  <!-- ===== 格 3：WebSocket ===== -->
  <g>
    <rect x="804" y="134" width="352" height="516" rx="18" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="804" y="134" width="352" height="40" rx="18" fill="#06B6D4"/>
    <rect x="804" y="156" width="352" height="18" fill="#06B6D4"/>
    <text x="980" y="161" font-size="18" font-weight="bold" text-anchor="middle" fill="#0E1E33">③ WebSocket：双向电话</text>

    <g transform="translate(878,232)">
      <rect x="-46" y="0" width="92" height="104" rx="14" fill="#DBEAFE" stroke="#0E1E33" stroke-width="3"/>
      <rect x="-46" y="0" width="92" height="22" rx="14" fill="#2563EB"/>
      <rect x="-46" y="12" width="92" height="10" fill="#2563EB"/>
      <circle cx="-30" cy="11" r="3.4" fill="#EF4444"/><circle cx="-18" cy="11" r="3.4" fill="#F59E0B"/><circle cx="-6" cy="11" r="3.4" fill="#10B981"/>
      <circle cx="-16" cy="52" r="4.5" fill="#0E1E33"/><circle cx="16" cy="52" r="4.5" fill="#0E1E33"/>
      <path d="M -12 72 Q 0 82 12 72" fill="none" stroke="#0E1E33" stroke-width="2.6" stroke-linecap="round"/>
      <text x="0" y="126" font-size="13" text-anchor="middle" fill="#0E1E33">小浏</text>
    </g>
    <g transform="translate(1072,232)">
      <rect x="-34" y="0" width="68" height="104" rx="10" fill="#CFFAFE" stroke="#0E1E33" stroke-width="3"/>
      <rect x="-24" y="14" width="48" height="8" rx="4" fill="#0E1E33"/>
      <rect x="-24" y="34" width="48" height="8" rx="4" fill="#0E1E33"/>
      <rect x="-24" y="54" width="48" height="8" rx="4" fill="#0E1E33"/>
      <circle cx="22" cy="86" r="5" fill="#10B981"/>
      <text x="0" y="126" font-size="13" text-anchor="middle" fill="#0E1E33">服叔</text>
    </g>
    <!-- 发光双向管道 -->
    <line x1="930" y1="272" x2="1032" y2="272" stroke="#06B6D4" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <line x1="930" y1="292" x2="1032" y2="292" stroke="#8B5CF6" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <line x1="930" y1="272" x2="1032" y2="272" stroke="#0E1E33" stroke-width="2.4" marker-end="url(#ar)"/>
    <line x1="1032" y1="292" x2="930" y2="292" stroke="#0E1E33" stroke-width="2.4" marker-end="url(#ar)"/>
    <circle cx="956" cy="272" r="4" fill="#06B6D4"/><circle cx="994" cy="292" r="4" fill="#8B5CF6"/>

    <text x="980" y="350" font-size="13" text-anchor="middle" fill="#0E1E33">一次握手（HTTP 101）</text>
    <text x="980" y="372" font-size="13" text-anchor="middle" fill="#0E1E33">同一条 TCP，双方随时说话</text>

    <!-- 特性卡片 -->
    <g font-size="13.5" fill="#0E1E33">
      <rect x="826" y="402" width="148" height="52" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="900" y="425" text-anchor="middle" font-weight="bold">全双工</text>
      <text x="900" y="445" text-anchor="middle" font-size="12">即时送达</text>
      <rect x="986" y="402" width="148" height="52" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
      <text x="1060" y="425" text-anchor="middle" font-weight="bold">低开销</text>
      <text x="1060" y="445" text-anchor="middle" font-size="12">帧头最小 2 字节</text>
      <rect x="826" y="466" width="148" height="52" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="900" y="489" text-anchor="middle" font-weight="bold">持久连接</text>
      <text x="900" y="509" text-anchor="middle" font-size="12">长期复用</text>
      <rect x="986" y="466" width="148" height="52" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="1060" y="489" text-anchor="middle" font-weight="bold">RFC 6455</text>
      <text x="1060" y="509" text-anchor="middle" font-size="12">2011 年标准</text>
    </g>
    <!-- 气泡 -->
    <rect x="840" y="550" width="280" height="78" rx="12" fill="#CFFAFE" stroke="#0E1E33" stroke-width="2.4"/>
    <path d="M 960 550 L 948 530 L 984 550 Z" fill="#CFFAFE" stroke="#0E1E33" stroke-width="2.4"/>
    <text x="980" y="580" font-size="13.5" text-anchor="middle" fill="#0E1E33">像“打电话”，而不是</text>
    <text x="980" y="604" font-size="13.5" text-anchor="middle" fill="#0E1E33">一轮轮“发短信”</text>
  </g>

  <!-- 底部金句 -->
  <rect x="44" y="672" width="1112" height="88" rx="16" fill="#0E1E33"/>
  <text x="600" y="708" font-size="17" font-weight="bold" text-anchor="middle" fill="#06B6D4">本幕金句</text>
  <text x="600" y="738" font-size="15.5" text-anchor="middle" fill="#FFFFFF">HTTP 的根本限制：服务端永远无法主动联系客户端。聊天室/行情/协同这类场景，需要的是一条双向长连接。</text>
</svg>
