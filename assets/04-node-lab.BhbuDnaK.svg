<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>
  <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E1E33"/></marker></defs>

  <rect x="44" y="38" width="600" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#10B981">第四幕 · Node 实验室</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">Echo 回声 · readyState 四态 · 聊天室广播与心跳</text>

  <!-- 格1：Echo -->
  <g>
    <rect x="44" y="130" width="542" height="280" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="64" y="160" font-size="16" font-weight="bold" fill="#10B981">① Echo 回声服务器（ws 库，实测）</text>

    <!-- 对话 -->
    <g transform="translate(96,210)">
      <rect x="-40" y="-28" width="80" height="50" rx="10" fill="#DBEAFE" stroke="#0E1E33" stroke-width="2.4"/>
      <rect x="-40" y="-28" width="80" height="14" rx="10" fill="#2563EB"/>
      <circle cx="-28" cy="-21" r="2.6" fill="#EF4444"/><circle cx="-19" cy="-21" r="2.6" fill="#F59E0B"/><circle cx="-10" cy="-21" r="2.6" fill="#10B981"/>
      <text x="0" y="6" font-size="11" text-anchor="middle">小浏</text>
    </g>
    <g transform="translate(500,210)">
      <rect x="-34" y="-28" width="68" height="50" rx="9" fill="#CFFAFE" stroke="#0E1E33" stroke-width="2.4"/>
      <rect x="-26" y="-18" width="52" height="5" rx="2.5" fill="#0E1E33"/>
      <rect x="-26" y="-8" width="52" height="5" rx="2.5" fill="#0E1E33"/>
      <text x="0" y="12" font-size="11" text-anchor="middle">服叔 :8080</text>
    </g>
    <rect x="150" y="182" width="190" height="30" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="245" y="202" font-size="12.5" text-anchor="middle">你好，WebSocket！</text>
    <line x1="138" y1="205" x2="150" y2="197" stroke="#0E1E33" stroke-width="2"/>
    <rect x="272" y="222" width="210" height="30" rx="15" fill="#CFFAFE" stroke="#06B6D4" stroke-width="2"/>
    <text x="377" y="242" font-size="12.5" text-anchor="middle">[echo] 你好，WebSocket！</text>
    <line x1="486" y1="240" x2="470" y2="234" stroke="#0E1E33" stroke-width="2"/>

    <!-- 终端输出 -->
    <rect x="64" y="268" width="502" height="124" rx="10" fill="#0E1E33"/>
    <text x="80" y="291" font-size="11.5" fill="#67E8F9">$ node node/echo-server.js</text>
    <text x="80" y="312" font-size="11.5" fill="#E2E8F0">[服务端] 新连接建立，来自 ::1，当前在线 1 人</text>
    <text x="80" y="332" font-size="11.5" fill="#E2E8F0">[服务端] 收到消息: 你好，WebSocket！</text>
    <text x="80" y="352" font-size="11.5" fill="#E2E8F0">[客户端] 收到: [echo] 你好，WebSocket！</text>
    <text x="80" y="372" font-size="11.5" fill="#94A3B8">[客户端] 连接已关闭，code=1000</text>
    <text x="64" y="404" font-size="11.5" fill="#0E1E33">代码：examples/node/echo-server.js · client.js</text>
  </g>

  <!-- 格2：readyState 四态 -->
  <g>
    <rect x="602" y="130" width="554" height="280" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="622" y="160" font-size="16" font-weight="bold" fill="#2563EB">② 浏览器原生 API：readyState 四态</text>

    <g font-size="12.5" fill="#0E1E33">
      <rect x="622" y="182" width="120" height="86" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.2"/>
      <text x="682" y="210" text-anchor="middle" font-weight="bold">0 CONNECTING</text>
      <text x="682" y="232" text-anchor="middle" font-size="11">握手中</text>
      <text x="682" y="252" text-anchor="middle" font-size="11">黄灯</text>

      <rect x="758" y="182" width="120" height="86" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2.2"/>
      <text x="818" y="210" text-anchor="middle" font-weight="bold">1 OPEN</text>
      <text x="818" y="232" text-anchor="middle" font-size="11">可收发</text>
      <text x="818" y="252" text-anchor="middle" font-size="11">绿灯</text>

      <rect x="894" y="182" width="120" height="86" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.2"/>
      <text x="954" y="210" text-anchor="middle" font-weight="bold">2 CLOSING</text>
      <text x="954" y="232" text-anchor="middle" font-size="11">关闭握手中</text>
      <text x="954" y="252" text-anchor="middle" font-size="11">红灯闪</text>

      <rect x="1030" y="182" width="110" height="86" rx="10" fill="#E5E7EB" stroke="#6B7280" stroke-width="2.2"/>
      <text x="1085" y="210" text-anchor="middle" font-weight="bold">3 CLOSED</text>
      <text x="1085" y="232" text-anchor="middle" font-size="11">已关闭</text>
      <text x="1085" y="252" text-anchor="middle" font-size="11">灰灯</text>
    </g>
    <g stroke="#0E1E33" stroke-width="2.2">
      <line x1="744" y1="225" x2="754" y2="225" marker-end="url(#a4)"/>
      <line x1="880" y1="225" x2="890" y2="225" marker-end="url(#a4)"/>
      <line x1="1016" y1="225" x2="1026" y2="225" marker-end="url(#a4)"/>
    </g>
    <!-- 代码 -->
    <rect x="622" y="286" width="514" height="106" rx="10" fill="#0E1E33"/>
    <text x="638" y="310" font-size="12" fill="#E2E8F0">const ws = new WebSocket('ws://localhost:8080');</text>
    <text x="638" y="332" font-size="12" fill="#E2E8F0">ws.onopen / ws.onmessage / ws.onclose / ws.onerror</text>
    <text x="638" y="354" font-size="12" fill="#FBBF24">if (ws.readyState === WebSocket.OPEN) ws.send(...)</text>
    <text x="638" y="378" font-size="11.5" fill="#94A3B8">// 发送前必须查 OPEN，否则向已断开连接发送会抛异常</text>
  </g>

  <!-- 格3：聊天室广播 + 心跳 -->
  <g>
    <rect x="44" y="426" width="1112" height="222" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="64" y="456" font-size="16" font-weight="bold" fill="#8B5CF6">③ 聊天室两大机制：广播 + 协议级心跳（chat-server.js）</text>

    <!-- 广播 -->
    <g transform="translate(560,500)">
      <rect x="-44" y="-40" width="88" height="80" rx="10" fill="#CFFAFE" stroke="#0E1E33" stroke-width="2.6"/>
      <rect x="-34" y="-28" width="68" height="6" rx="3" fill="#0E1E33"/>
      <rect x="-34" y="-14" width="68" height="6" rx="3" fill="#0E1E33"/>
      <rect x="-34" y="0" width="68" height="6" rx="3" fill="#0E1E33"/>
      <circle cx="30" cy="28" r="5" fill="#10B981"/>
      <text x="0" y="62" font-size="12" text-anchor="middle">服叔广播</text>
    </g>
    <!-- 三个客户端 -->
    <g transform="translate(150,500)">
      <rect x="-36" y="-26" width="72" height="52" rx="10" fill="#DBEAFE" stroke="#0E1E33" stroke-width="2.2"/>
      <rect x="-36" y="-26" width="72" height="14" rx="10" fill="#2563EB"/>
      <text x="0" y="12" font-size="10.5" text-anchor="middle">小浏 A</text>
    </g>
    <g transform="translate(150,586)">
      <rect x="-36" y="-26" width="72" height="52" rx="10" fill="#DBEAFE" stroke="#0E1E33" stroke-width="2.2"/>
      <rect x="-36" y="-26" width="72" height="14" rx="10" fill="#2563EB"/>
      <text x="0" y="12" font-size="10.5" text-anchor="middle">小浏 B</text>
    </g>
    <g transform="translate(280,543)">
      <rect x="-36" y="-26" width="72" height="52" rx="10" fill="#DBEAFE" stroke="#0E1E33" stroke-width="2.2"/>
      <rect x="-36" y="-26" width="72" height="14" rx="10" fill="#2563EB"/>
      <text x="0" y="12" font-size="10.5" text-anchor="middle">小浏 C</text>
    </g>
    <g stroke="#8B5CF6" stroke-width="2.2" fill="none">
      <path d="M 512 486 C 400 470, 300 470, 190 478" marker-end="url(#a4)"/>
      <path d="M 512 543 L 320 543" marker-end="url(#a4)"/>
      <path d="M 512 560 C 400 590, 300 592, 190 584" marker-end="url(#a4)"/>
    </g>
    <text x="350" y="466" font-size="11.5" text-anchor="middle" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">遍历 wss.clients，只发 OPEN 状态的连接</text>

    <!-- 心跳区 -->
    <line x1="660" y1="446" x2="660" y2="634" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/>
    <g transform="translate(760,498)">
      <rect x="-34" y="-16" width="68" height="32" rx="16" fill="#F59E0B" stroke="#0E1E33" stroke-width="2.2"/>
      <text x="0" y="5" font-size="12.5" font-weight="bold" text-anchor="middle">Ping</text>
    </g>
    <g transform="translate(980,498)">
      <rect x="-36" y="-26" width="72" height="52" rx="10" fill="#DBEAFE" stroke="#0E1E33" stroke-width="2.2"/>
      <rect x="-36" y="-26" width="72" height="14" rx="10" fill="#2563EB"/>
      <text x="0" y="12" font-size="10.5" text-anchor="middle">小浏</text>
    </g>
    <line x1="800" y1="490" x2="940" y2="484" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#a4)"/>
    <text x="870" y="474" font-size="11.5" text-anchor="middle">每 10s</text>
    <g transform="translate(760,558)">
      <rect x="-34" y="-16" width="68" height="32" rx="16" fill="#FBBF24" stroke="#0E1E33" stroke-width="2.2"/>
      <text x="0" y="5" font-size="12.5" font-weight="bold" text-anchor="middle">Pong</text>
    </g>
    <line x1="940" y1="550" x2="800" y2="556" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#a4)"/>
    <text x="870" y="582" font-size="11.5" text-anchor="middle" fill="#047857">收到 pong → isAlive 续命</text>

    <rect x="1020" y="540" width="120" height="56" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.2"/>
    <text x="1080" y="562" font-size="11.5" text-anchor="middle" fill="#B91C1C" font-weight="bold">收不到 pong？</text>
    <text x="1080" y="582" font-size="11.5" text-anchor="middle" fill="#B91C1C">ws.terminate()</text>
  </g>

  <!-- 底部 -->
  <rect x="44" y="666" width="1112" height="94" rx="16" fill="#0E1E33"/>
  <text x="64" y="698" font-size="15" font-weight="bold" fill="#10B981">为什么必须心跳？</text>
  <text x="64" y="726" font-size="14" fill="#FFFFFF">对端断网/断电/进程崩溃时，TCP 不会有任何通知（半开连接）。不发 Ping，服叔会一直给"幽灵连接"留着内存和文件描述符。</text>
  <text x="64" y="750" font-size="12.5" fill="#94A3B8">浏览器多标签打开 examples/browser/index.html 即可体验多人聊天</text>
</svg>
