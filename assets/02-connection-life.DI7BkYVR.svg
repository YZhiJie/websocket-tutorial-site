<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>
  <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E1E33"/></marker></defs>

  <rect x="44" y="38" width="640" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#2563EB">第二幕 · 一条连接的诞生</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">生命周期四阶段 · HTTP 握手 · 数据帧 · 关闭码</text>

  <!-- 格1：生命周期流水线 -->
  <g>
    <rect x="44" y="130" width="690" height="252" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="64" y="158" font-size="16" font-weight="bold" fill="#2563EB">① 生命周期四阶段</text>
    <!-- 四个阶段节点 -->
    <g font-size="12.5" fill="#0E1E33">
      <rect x="62" y="178" width="140" height="92" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.4"/>
      <text x="132" y="208" text-anchor="middle" font-weight="bold">1. 握手请求</text>
      <text x="132" y="230" text-anchor="middle">HTTP GET</text>
      <text x="132" y="250" text-anchor="middle">Upgrade: websocket</text>

      <rect x="230" y="178" width="140" height="92" rx="12" fill="#CFFAFE" stroke="#06B6D4" stroke-width="2.4"/>
      <text x="300" y="208" text-anchor="middle" font-weight="bold">2. 协议升级</text>
      <text x="300" y="230" text-anchor="middle">101 Switching</text>
      <text x="300" y="250" text-anchor="middle">Protocols</text>

      <rect x="398" y="178" width="140" height="92" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.4"/>
      <text x="468" y="208" text-anchor="middle" font-weight="bold">3. 双向通信</text>
      <text x="468" y="230" text-anchor="middle">文本/二进制帧</text>
      <text x="468" y="250" text-anchor="middle">Ping / Pong</text>

      <rect x="566" y="178" width="146" height="92" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.4"/>
      <text x="639" y="208" text-anchor="middle" font-weight="bold">4. 礼貌关闭</text>
      <text x="639" y="230" text-anchor="middle">Close 帧互回</text>
      <text x="639" y="250" text-anchor="middle">携带状态码</text>
    </g>
    <g stroke="#0E1E33" stroke-width="2.4">
      <line x1="204" y1="224" x2="226" y2="224" marker-end="url(#a2)"/>
      <line x1="372" y1="224" x2="394" y2="224" marker-end="url(#a2)"/>
      <line x1="540" y1="224" x2="562" y2="224" marker-end="url(#a2)"/>
    </g>
    <!-- 小浏与服叔 -->
    <g transform="translate(150,330)">
      <rect x="-34" y="-30" width="68" height="40" rx="10" fill="#DBEAFE" stroke="#0E1E33" stroke-width="2.4"/>
      <rect x="-34" y="-30" width="68" height="12" rx="10" fill="#2563EB"/>
      <circle cx="-22" cy="-24" r="2.4" fill="#EF4444"/><circle cx="-14" cy="-24" r="2.4" fill="#F59E0B"/><circle cx="-6" cy="-24" r="2.4" fill="#10B981"/>
      <text x="0" y="-2" font-size="11" text-anchor="middle" fill="#0E1E33">小浏</text>
    </g>
    <line x1="196" y1="300" x2="560" y2="300" stroke="#06B6D4" stroke-width="6" opacity="0.3"/>
    <line x1="560" y1="300" x2="196" y2="300" stroke="#0E1E33" stroke-width="2" marker-end="url(#a2)"/>
    <g transform="translate(616,330)">
      <rect x="-30" y="-30" width="60" height="40" rx="8" fill="#CFFAFE" stroke="#0E1E33" stroke-width="2.4"/>
      <rect x="-22" y="-22" width="44" height="5" rx="2.5" fill="#0E1E33"/>
      <rect x="-22" y="-12" width="44" height="5" rx="2.5" fill="#0E1E33"/>
      <text x="0" y="-2" font-size="11" text-anchor="middle" fill="#0E1E33">服叔</text>
    </g>
    <text x="378" y="362" font-size="12.5" text-anchor="middle" fill="#0E1E33">同一条 TCP 连接：先讲 HTTP，101 之后改讲 WebSocket 帧</text>
  </g>

  <!-- 格2：握手报文 -->
  <g>
    <rect x="750" y="130" width="406" height="252" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="770" y="158" font-size="16" font-weight="bold" fill="#06B6D4">② 握手真实抓包（curl 实测）</text>
    <!-- 请求 -->
    <rect x="768" y="172" width="178" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="778" y="192" font-size="12" font-weight="bold" fill="#2563EB">请求 →</text>
    <text x="778" y="212" font-size="11" fill="#0E1E33">GET / HTTP/1.1</text>
    <text x="778" y="230" font-size="11" fill="#0E1E33">Connection: Upgrade</text>
    <text x="778" y="248" font-size="11" fill="#0E1E33">Upgrade: websocket</text>
    <text x="778" y="266" font-size="11" fill="#0E1E33">Sec-WebSocket-Key: dGhl…</text>
    <text x="778" y="284" font-size="11" fill="#0E1E33">Sec-WebSocket-Version: 13</text>
    <text x="778" y="302" font-size="11" fill="#0E1E33">Origin: http://localhost</text>
    <!-- 响应 -->
    <rect x="960" y="172" width="180" height="140" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
    <text x="970" y="192" font-size="12" font-weight="bold" fill="#0E7490">← 响应</text>
    <text x="970" y="212" font-size="11" fill="#0E1E33">HTTP/1.1 101</text>
    <text x="970" y="230" font-size="11" fill="#0E1E33">Switching Protocols</text>
    <text x="970" y="248" font-size="11" fill="#0E1E33">Upgrade: websocket</text>
    <text x="970" y="266" font-size="11" fill="#0E1E33">Connection: Upgrade</text>
    <text x="970" y="284" font-size="11" fill="#0E1E33">Sec-WebSocket-Accept:</text>
    <text x="970" y="300" font-size="10.5" fill="#0E1E33">s3pPLMBi…K+xOo=</text>
    <!-- 公式 -->
    <rect x="768" y="324" width="372" height="44" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
    <text x="954" y="344" font-size="11.5" text-anchor="middle" fill="#0E1E33">Accept = Base64(SHA1(Key + 固定魔法 GUID))</text>
    <text x="954" y="361" font-size="11" text-anchor="middle" fill="#7C3AED">只证明“对方真的懂 WebSocket”，不是认证、不是加密</text>
  </g>

  <!-- 格3：帧结构 -->
  <g>
    <rect x="44" y="398" width="1112" height="246" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="64" y="426" font-size="16" font-weight="bold" fill="#8B5CF6">③ 数据帧：传输的最小单位（库自动拼，理解它是为了排错）</text>

    <!-- 帧位图 -->
    <g transform="translate(64,448)">
      <rect x="0" y="0" width="52" height="40" fill="#FEE2E2" stroke="#0E1E33" stroke-width="1.6"/>
      <text x="26" y="25" font-size="13" text-anchor="middle" fill="#0E1E33">FIN</text>
      <rect x="52" y="0" width="100" height="40" fill="#FEF3C7" stroke="#0E1E33" stroke-width="1.6"/>
      <text x="102" y="25" font-size="13" text-anchor="middle" fill="#0E1E33">opcode(4)</text>
      <rect x="152" y="0" width="60" height="40" fill="#FCE7F3" stroke="#0E1E33" stroke-width="1.6"/>
      <text x="182" y="25" font-size="13" text-anchor="middle" fill="#0E1E33">MASK</text>
      <rect x="212" y="0" width="120" height="40" fill="#DBEAFE" stroke="#0E1E33" stroke-width="1.6"/>
      <text x="272" y="25" font-size="12.5" text-anchor="middle" fill="#0E1E33">Payload len</text>
      <rect x="332" y="0" width="180" height="40" fill="#E5E7EB" stroke="#0E1E33" stroke-width="1.6"/>
      <text x="422" y="25" font-size="12.5" text-anchor="middle" fill="#0E1E33">Masking-key(32bit)</text>
      <rect x="512" y="0" width="260" height="40" fill="#CFFAFE" stroke="#0E1E33" stroke-width="1.6"/>
      <text x="642" y="25" font-size="13" text-anchor="middle" fill="#0E1E33">Payload Data 载荷</text>
    </g>
    <!-- opcode 图例 -->
    <g transform="translate(64,510)" font-size="12.5" fill="#0E1E33">
      <rect x="0" y="0" width="250" height="118" rx="10" fill="#FAFAFA" stroke="#0E1E33" stroke-width="1.6"/>
      <text x="14" y="24" font-weight="bold">opcode 速查</text>
      <text x="14" y="46">0x1 文本帧（必须 UTF-8）</text>
      <text x="14" y="66">0x2 二进制帧</text>
      <text x="14" y="86">0x8 Close 关闭帧</text>
      <text x="14" y="106">0x9 / 0xA　Ping / Pong</text>
    </g>
    <!-- PingPong 精灵与掩码说明 -->
    <g transform="translate(900,520)">
      <g transform="translate(-60,0)">
        <rect x="-34" y="-18" width="68" height="36" rx="18" fill="#F59E0B" stroke="#0E1E33" stroke-width="2.4"/>
        <text x="0" y="5" font-size="14" font-weight="bold" text-anchor="middle" fill="#0E1E33">Ping</text>
      </g>
      <line x1="28" y1="0" x2="92" y2="0" stroke="#0E1E33" stroke-width="2.4" marker-end="url(#a2)"/>
      <g transform="translate(150,0)">
        <rect x="-34" y="-18" width="68" height="36" rx="18" fill="#FBBF24" stroke="#0E1E33" stroke-width="2.4"/>
        <text x="0" y="5" font-size="14" font-weight="bold" text-anchor="middle" fill="#0E1E33">Pong</text>
      </g>
    </g>
    <text x="985" y="566" font-size="12" text-anchor="middle" fill="#0E1E33">Ping 必须原样回 Pong（库自动）</text>
    <text x="985" y="592" font-size="12" text-anchor="middle" fill="#0E1E33">客户端帧必须掩码：防的是中间代理，</text>
    <text x="985" y="614" font-size="12" text-anchor="middle" fill="#EF4444">掩码≠加密，机密性只能靠 wss(TLS)</text>
  </g>

  <!-- 底部关闭码 -->
  <rect x="44" y="660" width="1112" height="100" rx="16" fill="#0E1E33"/>
  <text x="64" y="690" font-size="15" font-weight="bold" fill="#F59E0B">④ 关闭是双向握手：一方发 Close → 另一方回 Close → 断 TCP</text>
  <g font-size="13" fill="#FFFFFF">
    <rect x="64" y="704" width="190" height="42" rx="10" fill="#1E3A5F"/>
    <text x="159" y="723" text-anchor="middle">1000 正常关闭</text>
    <text x="159" y="740" text-anchor="middle" font-size="11.5" fill="#94A3B8">任务完成</text>
    <rect x="270" y="704" width="190" height="42" rx="10" fill="#1E3A5F"/>
    <text x="365" y="723" text-anchor="middle">1001 端点离开</text>
    <text x="365" y="740" text-anchor="middle" font-size="11.5" fill="#94A3B8">页面关闭/跳转</text>
    <rect x="476" y="704" width="220" height="42" rx="10" fill="#3B1D2E"/>
    <text x="586" y="723" text-anchor="middle">1006 异常断开（本地哨兵值）</text>
    <text x="586" y="740" text-anchor="middle" font-size="11.5" fill="#FDA4AF">永不出现在线上 Close 帧</text>
    <rect x="712" y="704" width="200" height="42" rx="10" fill="#1E3A5F"/>
    <text x="812" y="723" text-anchor="middle">1008 违反策略</text>
    <text x="812" y="740" text-anchor="middle" font-size="11.5" fill="#94A3B8">如鉴权失败</text>
    <rect x="928" y="704" width="200" height="42" rx="10" fill="#1E3A5F"/>
    <text x="1028" y="723" text-anchor="middle">1011 服务端内部错误</text>
    <text x="1028" y="740" text-anchor="middle" font-size="11.5" fill="#94A3B8">完整表见附录 A</text>
  </g>
</svg>
