<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>
  <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E1E33"/></marker></defs>

  <rect x="44" y="38" width="640" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#8B5CF6">第三幕 · 站在 HTTP 的肩膀上</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">三种联系 · 一张对比表 · 选型三岔口</text>

  <!-- 格1：联系 -->
  <g>
    <rect x="44" y="130" width="384" height="500" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="64" y="160" font-size="17" font-weight="bold" fill="#06B6D4">联系：借道 HTTP，共享生态</text>

    <g transform="translate(236,222)">
      <rect x="-70" y="-44" width="140" height="88" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.6"/>
      <text x="0" y="-14" font-size="14" text-anchor="middle" fill="#0E1E33">同一扇门</text>
      <text x="0" y="8" font-size="15" font-weight="bold" text-anchor="middle" fill="#047857">ws :80 / wss :443</text>
      <text x="0" y="30" font-size="11.5" text-anchor="middle" fill="#0E1E33">防火墙、代理无需额外开端口</text>
    </g>
    <line x1="236" y1="272" x2="236" y2="300" stroke="#0E1E33" stroke-width="2.4" marker-end="url(#a3)"/>

    <g font-size="13" fill="#0E1E33">
      <rect x="64" y="308" width="344" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="80" y="332" font-weight="bold">① 握手复用 HTTP Upgrade</text>
      <text x="80" y="354" font-size="12">一个标准 HTTP GET 完成协议升级</text>

      <rect x="64" y="378" width="344" height="60" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="80" y="402" font-weight="bold">② 共用端口 80 / 443</text>
      <text x="80" y="424" font-size="12">顺利穿过绝大多数防火墙与代理</text>

      <rect x="64" y="448" width="344" height="90" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
      <text x="80" y="472" font-weight="bold">③ 复用 HTTP 基础设施</text>
      <text x="80" y="494" font-size="12">Cookies · TLS 证书 · Nginx 反向代理</text>
      <text x="80" y="516" font-size="12">负载均衡 · 网关鉴权，原样可用</text>
    </g>
    <g transform="translate(120,590)">
      <rect x="-28" y="-26" width="56" height="36" rx="9" fill="#DBEAFE" stroke="#0E1E33" stroke-width="2.2"/>
      <rect x="-28" y="-26" width="56" height="11" rx="9" fill="#2563EB"/>
      <text x="0" y="4" font-size="10.5" text-anchor="middle">小浏</text>
    </g>
    <line x1="156" y1="566" x2="316" y2="566" stroke="#10B981" stroke-width="5" opacity="0.35"/>
    <line x1="156" y1="566" x2="316" y2="566" stroke="#0E1E33" stroke-width="2" marker-end="url(#a3)"/>
    <text x="236" y="556" font-size="11.5" text-anchor="middle" fill="#047857">101 握手</text>
    <g transform="translate(352,590)">
      <rect x="-28" y="-26" width="56" height="36" rx="8" fill="#CFFAFE" stroke="#0E1E33" stroke-width="2.2"/>
      <rect x="-20" y="-18" width="40" height="4" rx="2" fill="#0E1E33"/>
      <rect x="-20" y="-10" width="40" height="4" rx="2" fill="#0E1E33"/>
      <text x="0" y="4" font-size="10.5" text-anchor="middle">服叔</text>
    </g>
  </g>

  <!-- 格2：对比表 -->
  <g>
    <rect x="448" y="130" width="708" height="500" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="468" y="160" font-size="17" font-weight="bold" fill="#2563EB">区别：两种完全不同的通信模型</text>

    <rect x="468" y="178" width="220" height="40" rx="8" fill="#0E1E33"/>
    <text x="578" y="204" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">维度</text>
    <rect x="692" y="178" width="226" height="40" rx="8" fill="#2563EB"/>
    <text x="805" y="204" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">HTTP</text>
    <rect x="922" y="178" width="216" height="40" rx="8" fill="#06B6D4"/>
    <text x="1030" y="204" font-size="14" font-weight="bold" text-anchor="middle" fill="#0E1E33">WebSocket</text>

    <g font-size="12.5" fill="#0E1E33">
      <rect x="468" y="222" width="670" height="44" fill="#F8FAFC"/>
      <text x="482" y="249" font-weight="bold">通信模式</text>
      <text x="704" y="249">半双工，一问一答</text>
      <text x="934" y="249" fill="#0E7490" font-weight="bold">全双工，随时互发</text>

      <rect x="468" y="268" width="670" height="44" fill="#FFFFFF"/>
      <text x="482" y="295" font-weight="bold">连接性质</text>
      <text x="704" y="295">短连接（逐请求）</text>
      <text x="934" y="295" fill="#0E7490" font-weight="bold">持久长连接</text>

      <rect x="468" y="314" width="670" height="44" fill="#F8FAFC"/>
      <text x="482" y="341" font-weight="bold">头部开销</text>
      <text x="704" y="341">每次几百字节</text>
      <text x="934" y="341" fill="#0E7490" font-weight="bold">帧头最小 2 字节</text>

      <rect x="468" y="360" width="670" height="44" fill="#FFFFFF"/>
      <text x="482" y="387" font-weight="bold">服务端推送</text>
      <text x="704" y="387">不支持（轮询变通）</text>
      <text x="934" y="387" fill="#0E7490" font-weight="bold">原生支持</text>

      <rect x="468" y="406" width="670" height="44" fill="#F8FAFC"/>
      <text x="482" y="433" font-weight="bold">状态保持</text>
      <text x="704" y="433">无状态</text>
      <text x="934" y="433" fill="#0E7490" font-weight="bold">连接即会话</text>

      <rect x="468" y="452" width="670" height="44" fill="#FFFFFF"/>
      <text x="482" y="479" font-weight="bold">URI</text>
      <text x="704" y="479">http:// · https://</text>
      <text x="934" y="479" fill="#0E7490" font-weight="bold">ws:// · wss://</text>

      <rect x="468" y="498" width="670" height="44" fill="#F8FAFC"/>
      <text x="482" y="525" font-weight="bold">消息边界</text>
      <text x="704" y="525">一请求对应一响应</text>
      <text x="934" y="525" fill="#0E7490" font-weight="bold">流式，数量方向无约束</text>

      <rect x="468" y="544" width="670" height="44" fill="#FEF2F2"/>
      <text x="482" y="571" font-weight="bold" fill="#B91C1C">项目实况</text>
      <text x="704" y="571" font-size="12">登录/查询 API</text>
      <text x="934" y="571" font-size="12" fill="#0E7490">实时推送通道</text>
    </g>
    <text x="803" y="612" font-size="12.5" text-anchor="middle" fill="#0E1E33">两者不是替代关系，而是共存：HTTP 管 CRUD，WebSocket 管实时</text>
  </g>

  <!-- 底部选型三岔口 -->
  <rect x="44" y="648" width="1112" height="112" rx="16" fill="#0E1E33"/>
  <text x="64" y="678" font-size="15" font-weight="bold" fill="#F59E0B">选型三岔口</text>
  <g font-size="13" fill="#FFFFFF">
    <rect x="64" y="692" width="340" height="54" rx="10" fill="#1E3A5F"/>
    <text x="234" y="715" text-anchor="middle" font-weight="bold">偶尔获取 / CRUD / 可缓存</text>
    <text x="234" y="737" text-anchor="middle" fill="#93C5FD">→ HTTP</text>
    <rect x="430" y="692" width="340" height="54" rx="10" fill="#2E2363"/>
    <text x="600" y="715" text-anchor="middle" font-weight="bold">服务端单向、低频通知</text>
    <text x="600" y="737" text-anchor="middle" fill="#C4B5FD">→ SSE（更简单，自带重连）</text>
    <rect x="796" y="692" width="336" height="54" rx="10" fill="#083344"/>
    <text x="964" y="715" text-anchor="middle" font-weight="bold">双向高频、实时性要求高</text>
    <text x="964" y="737" text-anchor="middle" fill="#67E8F9">→ WebSocket</text>
  </g>
</svg>
