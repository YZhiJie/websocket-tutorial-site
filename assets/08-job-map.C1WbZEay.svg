<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>

  <rect x="44" y="38" width="660" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#06B6D4">第八幕 · WebSocket 职业图谱</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">七大岗位 · 各自的技术要点 · 以及它不该接的活儿</text>

  <!-- 卡片网格 3 列 × 3 行 -->
  <!-- 行1 -->
  <g>
    <rect x="44" y="126" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.6"/>
    <circle cx="80" cy="164" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
    <text x="80" y="170" font-size="20" text-anchor="middle">💬</text>
    <text x="112" y="158" font-size="16" font-weight="bold" fill="#0E1E33">即时通讯 / 聊天室</text>
    <text x="112" y="178" font-size="11.5" fill="#2563EB">双向高频、低延迟</text>
    <text x="64" y="212" font-size="12" fill="#0E1E33">· 消息幂等去重（clientId）</text>
    <text x="64" y="234" font-size="12" fill="#0E1E33">· 历史消息与实时消息对账</text>
    <text x="64" y="256" font-size="12" fill="#0E1E33">· 在线状态 presence</text>
  </g>
  <g>
    <rect x="420" y="126" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.6"/>
    <circle cx="456" cy="164" r="22" fill="#CFFAFE" stroke="#06B6D4" stroke-width="2.2"/>
    <text x="456" y="170" font-size="20" text-anchor="middle">📊</text>
    <text x="488" y="158" font-size="16" font-weight="bold" fill="#0E1E33">实时数据看板</text>
    <text x="488" y="178" font-size="11.5" fill="#0E7490">服务端高频推送指标</text>
    <text x="440" y="212" font-size="12" fill="#0E1E33">· requestAnimationFrame 批量渲染</text>
    <text x="440" y="234" font-size="12" fill="#0E1E33">· 订阅调速 1Hz / 10Hz 分级</text>
    <text x="440" y="256" font-size="12" fill="#0E1E33">· 长列表窗口化，防 DOM 膨胀</text>
  </g>
  <g>
    <rect x="796" y="126" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.6"/>
    <circle cx="832" cy="164" r="22" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.2"/>
    <text x="832" y="170" font-size="20" text-anchor="middle">📝</text>
    <text x="864" y="158" font-size="16" font-weight="bold" fill="#0E1E33">协同编辑（文档/白板）</text>
    <text x="864" y="178" font-size="11.5" fill="#7C3AED">多人操作需即时同步</text>
    <text x="816" y="212" font-size="12" fill="#0E1E33">· OT / CRDT 冲突解决算法</text>
    <text x="816" y="234" font-size="12" fill="#0E1E33">· 操作序号保证因果顺序</text>
    <text x="816" y="256" font-size="12" fill="#0E1E33">· 断线期间操作回放</text>
  </g>

  <!-- 行2 -->
  <g>
    <rect x="44" y="298" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2.6"/>
    <circle cx="80" cy="336" r="22" fill="#D1FAE5" stroke="#10B981" stroke-width="2.2"/>
    <text x="80" y="342" font-size="20" text-anchor="middle">📈</text>
    <text x="112" y="330" font-size="16" font-weight="bold" fill="#0E1E33">金融行情推送</text>
    <text x="112" y="350" font-size="11.5" fill="#047857">毫秒级延迟敏感、数据量大</text>
    <text x="64" y="384" font-size="12" fill="#0E1E33">· 二进制协议（Protobuf）</text>
    <text x="64" y="406" font-size="12" fill="#0E1E33">· 增量更新而非全量</text>
    <text x="64" y="428" font-size="12" fill="#0E1E33">· 本地快照 + 增量合并</text>
  </g>
  <g>
    <rect x="420" y="298" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#EC4899" stroke-width="2.6"/>
    <circle cx="456" cy="336" r="22" fill="#FCE7F3" stroke="#EC4899" stroke-width="2.2"/>
    <text x="456" y="342" font-size="20" text-anchor="middle">🎮</text>
    <text x="488" y="330" font-size="16" font-weight="bold" fill="#0E1E33">在线游戏</text>
    <text x="488" y="350" font-size="11.5" fill="#BE185D">状态同步 10~60Hz</text>
    <text x="440" y="384" font-size="12" fill="#0E1E33">· 帧同步 / 状态同步选型</text>
    <text x="440" y="406" font-size="12" fill="#0E1E33">· 客户端预测 + 服务端裁决</text>
    <text x="440" y="428" font-size="12" fill="#0E1E33">· 更极致需求 → WebRTC / WebTransport</text>
  </g>
  <g>
    <rect x="796" y="298" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.6"/>
    <circle cx="832" cy="336" r="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="832" y="342" font-size="20" text-anchor="middle">🔔</text>
    <text x="864" y="330" font-size="16" font-weight="bold" fill="#0E1E33">通知 / 工单 / 审批</text>
    <text x="864" y="350" font-size="11.5" fill="#B45309">服务端单向推送为主</text>
    <text x="816" y="384" font-size="12" fill="#0E1E33">· 低频，未读数角标更新</text>
    <text x="816" y="406" font-size="12" fill="#0E1E33">· 移动端推送与站内通道互补</text>
    <text x="816" y="428" font-size="12" fill="#0E1E33">· 也可考虑 SSE：更简单自带重连</text>
  </g>

  <!-- 行3：物联网 + 不适合（两格各占一半） -->
  <g>
    <rect x="44" y="470" width="550" height="156" rx="14" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.6"/>
    <circle cx="80" cy="508" r="22" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.2"/>
    <text x="80" y="514" font-size="20" text-anchor="middle">📡</text>
    <text x="112" y="502" font-size="16" font-weight="bold" fill="#0E1E33">物联网设备监控</text>
    <text x="112" y="522" font-size="11.5" fill="#7C3AED">海量设备长连接</text>
    <text x="64" y="556" font-size="12" fill="#0E1E33">· 单机连接数优化（百万级走 C10M 方案）</text>
    <text x="64" y="578" font-size="12" fill="#0E1E33">· 与 MQTT 协议对比评估：弱网、低算力设备 MQTT 更合适</text>
    <text x="64" y="600" font-size="12" fill="#0E1E33">· ulimit -n 65535+，Redis Pub/Sub 跨机广播</text>
  </g>
  <g>
    <rect x="606" y="470" width="550" height="156" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.6" stroke-dasharray="8 5"/>
    <circle cx="642" cy="508" r="22" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.2"/>
    <text x="642" y="514" font-size="20" text-anchor="middle">🚫</text>
    <text x="674" y="502" font-size="16" font-weight="bold" fill="#B91C1C">不适合 WebSocket 的活儿</text>
    <text x="626" y="550" font-size="12.5" fill="#0E1E33">· 一次性数据查询、低频 CRUD</text>
    <text x="626" y="576" font-size="12.5" fill="#0E1E33">· 可被 CDN 缓存的静态/准静态内容</text>
    <text x="626" y="602" font-size="12.5" fill="#0E1E33">→ 普通 HTTP 更简单、可缓存、易扩展</text>
  </g>

  <!-- 底部 -->
  <rect x="44" y="642" width="1112" height="118" rx="16" fill="#0E1E33"/>
  <text x="600" y="680" font-size="16" font-weight="bold" text-anchor="middle" fill="#06B6D4">选型口诀</text>
  <text x="600" y="712" font-size="14.5" text-anchor="middle" fill="#FFFFFF">问自己三个问题：需要双向吗？频率高吗？延迟敏感吗？三个“是”才上 WebSocket；</text>
  <text x="600" y="740" font-size="14.5" text-anchor="middle" fill="#FFFFFF">单向低频用 SSE，偶尔一问一答用 HTTP——真实架构里三者各司其职、长期共存。</text>
</svg>
