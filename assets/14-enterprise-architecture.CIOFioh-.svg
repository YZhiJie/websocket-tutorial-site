<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Segoe UI,sans-serif">
  <rect width="920" height="460" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1677ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#389e0d"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,10 L10,5 z" fill="#722ed1"/></marker>
  </defs>
  <text x="40" y="32" font-size="17" font-weight="700" fill="#1f1f1f">企业级 WebSocket 实时架构：接入层 · 消息总线 · 业务服务</text>

  <!-- 客户端 -->
  <rect x="30" y="70" width="120" height="52" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.8"/>
  <text x="90" y="92" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle">浏览器</text>
  <text x="90" y="110" font-size="11" fill="#595959" text-anchor="middle">full-jitter 重连</text>
  <rect x="30" y="140" width="120" height="52" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.8"/>
  <text x="90" y="162" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle">移动 App</text>
  <text x="90" y="180" font-size="11" fill="#595959" text-anchor="middle">wss://443</text>
  <rect x="30" y="210" width="120" height="52" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.8"/>
  <text x="90" y="232" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle">IoT / 车机</text>
  <text x="90" y="250" font-size="11" fill="#595959" text-anchor="middle">百万级长连接</text>

  <!-- 全局负载均衡 -->
  <rect x="200" y="120" width="120" height="100" rx="12" fill="#fff7e6" stroke="#d46b08" stroke-width="1.8"/>
  <text x="260" y="150" font-size="13" font-weight="700" fill="#ad4e00" text-anchor="middle">GSLB / Anycast</text>
  <text x="260" y="174" font-size="11" fill="#595959" text-anchor="middle">就近接入</text>
  <text x="260" y="194" font-size="11" fill="#595959" text-anchor="middle">TLS 终止</text>
  <text x="260" y="212" font-size="11" fill="#595959" text-anchor="middle">连接数均衡</text>

  <!-- 接入层集群 -->
  <rect x="380" y="60" width="200" height="220" rx="12" fill="#f6ffed" stroke="#389e0d" stroke-width="2"/>
  <text x="480" y="88" font-size="13.5" font-weight="700" fill="#135200" text-anchor="middle">WebSocket 接入层（无状态）</text>
  <rect x="400" y="104" width="160" height="40" rx="8" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="480" y="129" font-size="12" fill="#135200" text-anchor="middle">Gateway-1</text>
  <rect x="400" y="152" width="160" height="40" rx="8" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="480" y="177" font-size="12" fill="#135200" text-anchor="middle">Gateway-2</text>
  <rect x="400" y="200" width="160" height="40" rx="8" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="480" y="225" font-size="12" fill="#135200" text-anchor="middle">Gateway-N</text>
  <text x="480" y="262" font-size="10.5" fill="#8c8c8c" text-anchor="middle">鉴权 · 心跳 · 限频 · 优雅摘流</text>

  <!-- 会话状态 -->
  <rect x="630" y="60" width="250" height="64" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.8"/>
  <text x="755" y="86" font-size="12.5" font-weight="700" fill="#391085" text-anchor="middle">会话 / Presence 存储（Redis Cluster）</text>
  <text x="755" y="108" font-size="11" fill="#595959" text-anchor="middle">userId → gateway-2（连接路由表）</text>

  <!-- 消息总线 -->
  <rect x="630" y="150" width="250" height="70" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.8"/>
  <text x="755" y="176" font-size="12.5" font-weight="700" fill="#391085" text-anchor="middle">消息总线</text>
  <text x="755" y="198" font-size="11" fill="#595959" text-anchor="middle">Redis Streams / NATS / Kafka</text>
  <text x="755" y="214" font-size="10.5" fill="#8c8c8c" text-anchor="middle">房间频道路由 · 削峰 · 跨网关广播</text>

  <!-- 业务服务 -->
  <rect x="630" y="246" width="250" height="64" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.8"/>
  <text x="755" y="272" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle">业务微服务（有状态逻辑）</text>
  <text x="755" y="294" font-size="11" fill="#595959" text-anchor="middle">IM · 行情 · 协同 · 审核 → DB</text>

  <!-- 连线 -->
  <line x1="150" y1="170" x2="198" y2="170" stroke="#1677ff" stroke-width="2" marker-end="url(#b)"/>
  <line x1="320" y1="170" x2="378" y2="170" stroke="#d46b08" stroke-width="2" marker-end="url(#b)"/>
  <line x1="580" y1="100" x2="628" y2="96" stroke="#722ed1" stroke-width="2" marker-end="url(#p)"/>
  <line x1="580" y1="180" x2="628" y2="185" stroke="#722ed1" stroke-width="2" marker-end="url(#p)"/>
  <line x1="580" y1="260" x2="628" y2="278" stroke="#1677ff" stroke-width="2" marker-end="url(#b)"/>
  <line x1="755" y1="220" x2="755" y2="244" stroke="#722ed1" stroke-width="2" marker-end="url(#p)"/>
  <line x1="700" y1="150" x2="580" y2="124" stroke="#389e0d" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#g)"/>
  <text x="640" y="140" font-size="10.5" fill="#389e0d" text-anchor="middle">按路由表投递</text>

  <!-- 底部要点 -->
  <rect x="100" y="380" width="720" height="50" rx="12" fill="#fafafa" stroke="#d9d9d9"/>
  <text x="460" y="401" font-size="12" fill="#595959" text-anchor="middle">接入层保持无状态：连接信息全部外置到 Redis，网关可随时扩缩容；</text>
  <text x="460" y="421" font-size="12" fill="#595959" text-anchor="middle">跨网关广播一律经消息总线按「房间/租户频道」投递，禁止网关之间点对点直连</text>
</svg>
