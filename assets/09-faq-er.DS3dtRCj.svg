<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>

  <rect x="44" y="38" width="600" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#EC4899">第九幕 · 急诊室 FAQ</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">六个最高频的线上急症 · 病因 · 处方</text>
  <!-- 十字灯 -->
  <g transform="translate(1100,74)">
    <rect x="-26" y="-10" width="52" height="20" rx="4" fill="#EF4444"/>
    <rect x="-10" y="-26" width="20" height="52" rx="4" fill="#EF4444"/>
  </g>

  <!-- Q1 -->
  <g>
    <rect x="44" y="128" width="360" height="228" rx="14" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="44" y="128" width="360" height="40" rx="14" fill="#2563EB"/>
    <rect x="44" y="150" width="360" height="18" fill="#2563EB"/>
    <text x="64" y="155" font-size="14.5" font-weight="bold" fill="#FFF">Q1 几分钟没消息就断</text>
    <text x="64" y="196" font-size="12.5" fill="#0E1E33">病因：Nginx/云 LB 回收空闲 TCP</text>
    <text x="64" y="216" font-size="12.5" fill="#0E1E33">（典型空闲超时 60s）</text>
    <text x="64" y="246" font-size="12.5" font-weight="bold" fill="#047857">处方：</text>
    <text x="64" y="268" font-size="12" fill="#0E1E33">① 心跳间隔 &lt; 中间件超时（≤30s）</text>
    <text x="64" y="290" font-size="12" fill="#0E1E33">② Nginx：proxy_read_timeout 3600s</text>
    <rect x="60" y="304" width="328" height="40" rx="8" fill="#0E1E33"/>
    <text x="72" y="322" font-size="10.5" fill="#67E8F9">proxy_set_header Upgrade $http_upgrade;</text>
    <text x="72" y="338" font-size="10.5" fill="#67E8F9">proxy_set_header Connection "upgrade";</text>
  </g>

  <!-- Q2 -->
  <g>
    <rect x="420" y="128" width="360" height="228" rx="14" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="420" y="128" width="360" height="40" rx="14" fill="#8B5CF6"/>
    <rect x="420" y="150" width="360" height="18" fill="#8B5CF6"/>
    <text x="440" y="155" font-size="14.5" font-weight="bold" fill="#FFF">Q2 收不到对方断开通知</text>
    <text x="440" y="196" font-size="12.5" fill="#0E1E33">病因：半开连接——对端断电/断网时</text>
    <text x="440" y="216" font-size="12.5" fill="#0E1E33">TCP 本地不会有任何事件</text>
    <!-- 半开示意 -->
    <line x1="470" y1="246" x2="730" y2="246" stroke="#EF4444" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="470" y="270" font-size="11.5" fill="#B91C1C">线还“连着”，人已经没了</text>
    <text x="440" y="300" font-size="12.5" font-weight="bold" fill="#047857">处方：定期心跳是唯一可靠手段</text>
    <text x="440" y="326" font-size="12" fill="#0E1E33">WebSocket 开发最经典的问题</text>
    <text x="440" y="346" font-size="12" fill="#0E1E33">（详见第六幕双层心跳）</text>
  </g>

  <!-- Q3 -->
  <g>
    <rect x="796" y="128" width="360" height="228" rx="14" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="796" y="128" width="360" height="40" rx="14" fill="#06B6D4"/>
    <rect x="796" y="150" width="360" height="18" fill="#06B6D4"/>
    <text x="816" y="155" font-size="14.5" font-weight="bold" fill="#0E1E33">Q3 消息发送失败/丢失</text>
    <text x="816" y="196" font-size="12.5" fill="#0E1E33">事实：TCP 保证单条不丢不乱序，</text>
    <text x="816" y="216" font-size="12.5" fill="#0E1E33">但断线瞬间发送、重连期间消息会丢</text>
    <text x="816" y="246" font-size="12.5" font-weight="bold" fill="#047857">处方：应用层 ACK</text>
    <text x="816" y="270" font-size="12" fill="#0E1E33">· 每条消息带唯一 clientId</text>
    <text x="816" y="292" font-size="12" fill="#0E1E33">· 服务端收到后回执</text>
    <text x="816" y="314" font-size="12" fill="#0E1E33">· 超时未收到回执则重发</text>
    <text x="816" y="338" font-size="12" fill="#0E1E33">· 服务端按 clientId 幂等去重</text>
  </g>

  <!-- Q4 -->
  <g>
    <rect x="44" y="372" width="360" height="228" rx="14" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="44" y="372" width="360" height="40" rx="14" fill="#F59E0B"/>
    <rect x="44" y="394" width="360" height="18" fill="#F59E0B"/>
    <text x="64" y="399" font-size="14.5" font-weight="bold" fill="#0E1E33">Q4 connection failed 排查</text>
    <text x="64" y="440" font-size="12" fill="#0E1E33">① 服务在不在？lsof -i :8080</text>
    <text x="64" y="466" font-size="12" fill="#0E1E33">② ws/wss 用错？HTTPS 页只能连 wss</text>
    <text x="64" y="492" font-size="12" fill="#0E1E33">③ 网关有没有透传 Upgrade 头</text>
    <text x="64" y="518" font-size="12" fill="#0E1E33">④ Origin 校验 / CSWSH 策略拦截</text>
    <rect x="60" y="536" width="328" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="224" y="557" font-size="11.5" text-anchor="middle" fill="#B45309">注意：WebSocket 不受 CORS 限制，</text>
    <text x="224" y="575" font-size="11.5" text-anchor="middle" fill="#B45309">但服务端应校验 Origin</text>
  </g>

  <!-- Q5 -->
  <g>
    <rect x="420" y="372" width="360" height="228" rx="14" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="420" y="372" width="360" height="40" rx="14" fill="#10B981"/>
    <rect x="420" y="394" width="360" height="18" fill="#10B981"/>
    <text x="440" y="399" font-size="14.5" font-weight="bold" fill="#FFF">Q5 并发连接数上不去</text>
    <text x="440" y="440" font-size="12" fill="#0E1E33">· ulimit -n 调大（生产 65535+）</text>
    <text x="440" y="466" font-size="12" fill="#0E1E33">· Node 每连接约 10~20KB 内存</text>
    <text x="440" y="486" font-size="12" fill="#0E1E33">　10 万连接 ≈ 2GB</text>
    <text x="440" y="516" font-size="12" fill="#0E1E33">· 多进程/多机广播：</text>
    <text x="440" y="538" font-size="12" fill="#0E1E33">　Redis Pub/Sub 消息总线</text>
    <rect x="440" y="552" width="320" height="34" rx="8" fill="#0E1E33"/>
    <text x="600" y="574" font-size="12" text-anchor="middle" fill="#A7F3D0">ulimit -n 65535</text>
  </g>

  <!-- Q6 -->
  <g>
    <rect x="796" y="372" width="360" height="228" rx="14" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <rect x="796" y="372" width="360" height="40" rx="14" fill="#EC4899"/>
    <rect x="796" y="394" width="360" height="18" fill="#EC4899"/>
    <text x="816" y="399" font-size="14.5" font-weight="bold" fill="#FFF">Q6 JSON 太慢/太大</text>
    <text x="816" y="440" font-size="12.5" fill="#0E1E33">文本 JSON 适合绝大多数场景；</text>
    <text x="816" y="460" font-size="12.5" fill="#0E1E33">真到瓶颈再优化：</text>
    <text x="816" y="490" font-size="12" fill="#0E1E33">① MessagePack / Protobuf</text>
    <text x="816" y="512" font-size="12" fill="#0E1E33">　体积减 30~70%，CPU 减半</text>
    <text x="816" y="540" font-size="12" fill="#0E1E33">② 高频小消息合并批次发送</text>
    <text x="816" y="562" font-size="12" fill="#0E1E33">　牺牲数 ms 延迟换吞吐</text>
    <text x="816" y="588" font-size="11.5" fill="#6B7280">别过早优化：先测量再动手</text>
  </g>

  <!-- 底部 -->
  <rect x="44" y="618" width="1112" height="100" rx="16" fill="#0E1E33"/>
  <text x="600" y="654" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#EC4899">急诊共识</text>
  <text x="600" y="684" font-size="14" text-anchor="middle" fill="#FFFFFF">六个问题里四个（Q1/Q2/Q3/Q5）的根因都指向同一件事：WebSocket 把“连接管理”的责任交给了应用——</text>
  <text x="600" y="708" font-size="14" text-anchor="middle" fill="#FFFFFF">心跳、重连、ACK、资源上限，一个都不能省。完整排查命令与 Nginx 配置见主线第 9 章。</text>
</svg>
