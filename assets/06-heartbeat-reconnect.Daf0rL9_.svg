<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>
  <defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E1E33"/></marker></defs>

  <rect x="44" y="38" width="600" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#EC4899">第六幕 · 连接续命术</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">双层心跳 · Full Jitter 退避 · 握手鉴权 · 二进制</text>

  <!-- 格1：双层心跳 -->
  <g>
    <rect x="44" y="130" width="550" height="252" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="64" y="160" font-size="16" font-weight="bold" fill="#F59E0B">① 双层心跳：协议级 + 应用级</text>

    <!-- 协议级 -->
    <rect x="64" y="178" width="242" height="184" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="185" y="204" font-size="13.5" font-weight="bold" text-anchor="middle">协议级 Ping/Pong</text>
    <g transform="translate(185,236)">
      <rect x="-30" y="-14" width="60" height="28" rx="14" fill="#F59E0B" stroke="#0E1E33" stroke-width="2"/>
      <text x="0" y="5" font-size="11.5" font-weight="bold" text-anchor="middle">Ping</text>
    </g>
    <text x="185" y="272" font-size="11.5" text-anchor="middle">服叔每 10~30s 发帧</text>
    <g transform="translate(185,296)">
      <rect x="-30" y="-14" width="60" height="28" rx="14" fill="#FBBF24" stroke="#0E1E33" stroke-width="2"/>
      <text x="0" y="5" font-size="11.5" font-weight="bold" text-anchor="middle">Pong</text>
    </g>
    <text x="185" y="344" font-size="11" text-anchor="middle" fill="#047857">能发现：断网/崩溃（半开）</text>

    <!-- 应用级 -->
    <rect x="322" y="178" width="252" height="184" rx="12" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.2"/>
    <text x="448" y="204" font-size="13.5" font-weight="bold" text-anchor="middle">应用级看门狗</text>
    <rect x="342" y="218" width="212" height="56" rx="10" fill="#0E1E33"/>
    <text x="448" y="240" font-size="11" text-anchor="middle" fill="#FBCFE8">定时发 {"type":"ping"}</text>
    <text x="448" y="260" font-size="11" text-anchor="middle" fill="#FBCFE8">等业务回包 · 8s 无动静</text>
    <text x="448" y="298" font-size="11.5" text-anchor="middle" fill="#0E1E33">内核还在回 Pong，业务却卡死？</text>
    <text x="448" y="320" font-size="11.5" text-anchor="middle" fill="#BE185D" font-weight="bold">只有应用心跳能发现假死</text>
    <text x="448" y="346" font-size="10.5" text-anchor="middle" fill="#6B7280">reconnect-client.js 完整实现</text>
  </g>

  <!-- 格2：鉴权三载体 -->
  <g>
    <rect x="610" y="130" width="546" height="252" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="630" y="160" font-size="16" font-weight="bold" fill="#8B5CF6">② 握手鉴权：Token 放哪里？</text>

    <g font-size="12" fill="#0E1E33">
      <rect x="630" y="178" width="506" height="56" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="646" y="201" font-weight="bold">① URL Query</text>
      <text x="646" y="222" font-size="11">wss://api/ws?token=xxx —— 最简单；只在 wss 下用，防日志泄露</text>

      <rect x="630" y="244" width="506" height="56" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
      <text x="646" y="267" font-weight="bold">② Cookie</text>
      <text x="646" y="288" font-size="11">浏览器自动携带，服务端读握手请求 headers.cookie</text>

      <rect x="630" y="310" width="506" height="56" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="646" y="333" font-weight="bold">③ 子协议 Sec-WebSocket-Protocol</text>
      <text x="646" y="354" font-size="11">new WebSocket(url, ['bearer','xxx']) —— 浏览器 API 设不了 Authorization 头</text>
    </g>
    <text x="883" y="376" font-size="11" text-anchor="middle" fill="#B91C1C">失败：握手阶段返回 401，或建立后立即 close(1008, '鉴权失败')</text>
  </g>

  <!-- 格3：退避时间线 -->
  <g>
    <rect x="44" y="398" width="1112" height="250" rx="16" fill="#FFFFFF" stroke="#0E1E33" stroke-width="3"/>
    <text x="64" y="428" font-size="16" font-weight="bold" fill="#10B981">③ 指数退避 + Full Jitter：别在服叔刚复活时一拥而上</text>

    <!-- 左：错误示范 惊群 -->
    <g transform="translate(150,520)">
      <rect x="-96" y="-70" width="192" height="120" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.4"/>
      <text x="0" y="-46" font-size="13" font-weight="bold" text-anchor="middle" fill="#B91C1C">固定间隔 = 惊群</text>
      <!-- 服叔被压 -->
      <rect x="-24" y="20" width="48" height="26" rx="6" fill="#CFFAFE" stroke="#0E1E33" stroke-width="2"/>
      <text x="0" y="38" font-size="10" text-anchor="middle">服叔</text>
      <!-- 万箭 -->
      <g stroke="#EF4444" stroke-width="2.4">
        <line x1="-70" y1="-24" x2="-20" y2="18" marker-end="url(#a6)"/>
        <line x1="-30" y1="-30" x2="-6" y2="16" marker-end="url(#a6)"/>
        <line x1="10" y1="-30" x2="6" y2="16" marker-end="url(#a6)"/>
        <line x1="50" y1="-24" x2="20" y2="18" marker-end="url(#a6)"/>
      </g>
      <text x="-86" y="14" font-size="10.5" text-anchor="start" fill="#B91C1C">同时重连，</text>
      <text x="-86" y="32" font-size="10.5" text-anchor="start" fill="#B91C1C">二次压垮</text>
    </g>

    <!-- 右：正确时间线 -->
    <g transform="translate(330,450)">
      <text x="0" y="0" font-size="12.5" font-weight="bold" fill="#047857">正确：cap = min(30s, 1s × 2ⁿ)，delay = random() × cap</text>
      <!-- 坐标轴 -->
      <line x1="0" y1="160" x2="760" y2="160" stroke="#0E1E33" stroke-width="2"/>
      <!-- 柱子：1,2,4,8,16,30 封顶，柱内随机高度点 -->
      <g>
        <rect x="30" y="134" width="60" height="26" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
        <circle cx="50" cy="142" r="4.5" fill="#EC4899"/>
        <text x="60" y="182" font-size="11" text-anchor="middle">第1次 ≤1s</text>

        <rect x="150" y="108" width="60" height="52" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
        <circle cx="186" cy="124" r="4.5" fill="#EC4899"/>
        <text x="180" y="182" font-size="11" text-anchor="middle">第2次 ≤2s</text>

        <rect x="270" y="56" width="60" height="104" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
        <circle cx="292" cy="128" r="4.5" fill="#EC4899"/>
        <text x="300" y="182" font-size="11" text-anchor="middle">第3次 ≤4s</text>

        <rect x="390" y="20" width="60" height="140" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8"/>
        <text x="420" y="14" font-size="10.5" text-anchor="middle" fill="#7C3AED">8s</text>
        <circle cx="410" cy="66" r="4.5" fill="#EC4899"/>

        <rect x="510" y="20" width="60" height="140" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8"/>
        <text x="540" y="14" font-size="10.5" text-anchor="middle" fill="#7C3AED">16s</text>
        <circle cx="528" cy="96" r="4.5" fill="#EC4899"/>

        <rect x="630" y="20" width="60" height="140" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
        <text x="660" y="14" font-size="10.5" text-anchor="middle" fill="#B45309">30s 封顶</text>
        <circle cx="648" cy="52" r="4.5" fill="#EC4899"/>
      </g>
      <text x="380" y="192" font-size="11.5" text-anchor="middle" fill="#0E1E33">粉点 = full jitter 随机到的实际等待：重连时刻被彻底打散</text>
    </g>
  </g>

  <!-- 底部三个工程细节 -->
  <rect x="44" y="664" width="1112" height="96" rx="16" fill="#0E1E33"/>
  <text x="64" y="694" font-size="14.5" font-weight="bold" fill="#10B981">三个踩坑细节</text>
  <g font-size="12.5" fill="#E2E8F0">
    <text x="64" y="720">1. 用户主动退出（manualClose=true）与自动重连互斥，不能退出后又自己连回去</text>
    <text x="64" y="742">2. 每次重连前清理旧看门狗定时器，避免多个定时器并存重复 ping/重连</text>
  </g>
  <text x="640" y="720" font-size="12.5" fill="#E2E8F0">3. error 之后通常紧跟 close，重连逻辑统一放 close 处理</text>
  <text x="640" y="742" font-size="12.5" fill="#94A3B8">二进制帧：binaryType='arraybuffer'；子协议可协商 json / msgpack / MQTT…</text>
</svg>
