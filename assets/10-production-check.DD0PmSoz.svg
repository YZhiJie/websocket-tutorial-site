<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F6FF"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#0E1E33" stroke-width="4"/>

  <rect x="44" y="38" width="640" height="72" rx="16" fill="#0E1E33"/>
  <text x="70" y="72" font-size="28" font-weight="bold" fill="#10B981">第十幕 · 上线前的自检</text>
  <text x="70" y="99" font-size="16" fill="#FFFFFF">四类 18 项 · 全部打勾，才给上线盖放行章</text>

  <!-- 列1 连接可靠性 -->
  <g>
    <rect x="44" y="128" width="270" height="496" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.6"/>
    <rect x="44" y="128" width="270" height="44" rx="14" fill="#2563EB"/>
    <rect x="44" y="152" width="270" height="20" fill="#2563EB"/>
    <text x="179" y="157" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFF">连接可靠性</text>
    <g font-size="12" fill="#0E1E33">
      <rect x="60" y="190" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M63 197 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="84" y="203">指数退避 + full jitter</text>

      <rect x="60" y="252" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M63 259 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="84" y="262">主动关闭不重连</text>
      <text x="84" y="280" font-size="10.5" fill="#6B7280">manualClose 标记</text>

      <rect x="60" y="312" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M63 319 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="84" y="325">协议心跳 + 应用看门狗</text>
      <text x="84" y="343" font-size="10.5" fill="#6B7280">服务端 Ping / 客户端探活</text>

      <rect x="60" y="376" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M63 383 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="84" y="389">重连前清旧定时器</text>

      <rect x="60" y="432" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M63 439 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="84" y="445">重连后恢复会话</text>
      <text x="84" y="463" font-size="10.5" fill="#6B7280">重新 join 房间、补消息</text>
    </g>
    <rect x="60" y="520" width="238" height="84" rx="10" fill="#EFF6FF"/>
    <text x="74" y="544" font-size="11.5" fill="#1D4ED8">对应：第 6 章</text>
    <text x="74" y="566" font-size="11.5" fill="#1D4ED8">reconnect-client.js</text>
    <text x="74" y="588" font-size="11.5" fill="#1D4ED8">FAQ Q1 / Q2</text>
  </g>

  <!-- 列2 消息可靠性 -->
  <g>
    <rect x="326" y="128" width="270" height="496" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.6"/>
    <rect x="326" y="128" width="270" height="44" rx="14" fill="#06B6D4"/>
    <rect x="326" y="152" width="270" height="20" fill="#06B6D4"/>
    <text x="461" y="157" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E1E33">消息可靠性</text>
    <g font-size="12" fill="#0E1E33">
      <rect x="342" y="190" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M345 197 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="366" y="203">关键消息 ACK + 幂等</text>
      <text x="366" y="221" font-size="10.5" fill="#6B7280">clientId 去重</text>

      <rect x="342" y="262" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M345 269 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="366" y="275">消息带时间戳/序号</text>
      <text x="366" y="293" font-size="10.5" fill="#6B7280">可对账检测丢消息</text>

      <rect x="342" y="334" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M345 341 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="366" y="347">发送前查 OPEN</text>
      <text x="366" y="365" font-size="10.5" fill="#6B7280">失败入队，重连后重发</text>
    </g>
    <rect x="342" y="430" width="238" height="174" rx="10" fill="#ECFEFF"/>
    <text x="356" y="456" font-size="11.5" fill="#0E7490">记住：</text>
    <text x="356" y="480" font-size="11.5" fill="#0E1E33">TCP 保证单条不丢，</text>
    <text x="356" y="500" font-size="11.5" fill="#0E1E33">但不保证“重连期间”</text>
    <text x="356" y="520" font-size="11.5" fill="#0E1E33">的消息——这部分要</text>
    <text x="356" y="540" font-size="11.5" fill="#0E1E33">应用层自己补。</text>
    <text x="356" y="578" font-size="11.5" fill="#0E7490">对应：FAQ Q3</text>
  </g>

  <!-- 列3 安全 -->
  <g>
    <rect x="608" y="128" width="270" height="496" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.6"/>
    <rect x="608" y="128" width="270" height="44" rx="14" fill="#EF4444"/>
    <rect x="608" y="152" width="270" height="20" fill="#EF4444"/>
    <text x="743" y="157" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFF">安全</text>
    <g font-size="11.5" fill="#0E1E33">
      <rect x="624" y="186" width="14" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M627 192 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="646" y="198">只用 wss，全站跳 HTTPS</text>

      <rect x="624" y="236" width="14" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M627 242 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="646" y="248">握手鉴权 401/1008</text>

      <rect x="624" y="286" width="14" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M627 292 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="646" y="298">校验 Origin 防 CSWSH</text>

      <rect x="624" y="336" width="14" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M627 342 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="646" y="348">限连接数/频率/消息大小</text>

      <rect x="624" y="386" width="14" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M627 392 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="646" y="395">消息级授权</text>
      <text x="646" y="411" font-size="10" fill="#6B7280">JSON 解析必须 try-catch</text>

      <rect x="624" y="436" width="14" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M627 442 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="646" y="448">textContent 渲染防 XSS</text>
    </g>
    <rect x="624" y="478" width="238" height="126" rx="10" fill="#FEF2F2"/>
    <text x="638" y="502" font-size="11.5" fill="#B91C1C">对应：第 7 章</text>
    <text x="638" y="524" font-size="11.5" fill="#B91C1C">secure-server.js 六道防线</text>
    <text x="638" y="546" font-size="11.5" fill="#B91C1C">security-test.js 全部实测</text>
    <text x="638" y="568" font-size="11.5" fill="#B91C1C">7.9 RFC 6455 规范解读</text>
    <text x="638" y="590" font-size="11" fill="#B91C1C">掩码≠加密，机密靠 TLS</text>
  </g>

  <!-- 列4 性能 -->
  <g>
    <rect x="890" y="128" width="266" height="496" rx="14" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.6"/>
    <rect x="890" y="128" width="266" height="44" rx="14" fill="#8B5CF6"/>
    <rect x="890" y="152" width="266" height="20" fill="#8B5CF6"/>
    <text x="1023" y="157" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFF">性能</text>
    <g font-size="12" fill="#0E1E33">
      <rect x="906" y="190" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M909 197 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="930" y="200">广播查 readyState</text>
      <text x="930" y="218" font-size="10.5" fill="#6B7280">异常发送 try-catch 隔离</text>

      <rect x="906" y="252" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M909 259 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="930" y="265">rAF 整批渲染</text>
      <text x="930" y="283" font-size="10.5" fill="#6B7280">别每条消息重绘一次</text>

      <rect x="906" y="316" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M909 323 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="930" y="329">列表窗口化</text>
      <text x="930" y="347" font-size="10.5" fill="#6B7280">存 1000 条渲染 60 条</text>

      <rect x="906" y="380" width="15" height="15" rx="3" fill="none" stroke="#10B981" stroke-width="2.4"/><path d="M909 387 l4 4 l7 -8" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="930" y="393">大流量上二进制</text>
      <text x="930" y="411" font-size="10.5" fill="#6B7280">+ 消息合并批次</text>
    </g>
    <rect x="906" y="446" width="234" height="158" rx="10" fill="#F5F3FF"/>
    <text x="920" y="472" font-size="11.5" fill="#7C3AED">别忘了运维侧：</text>
    <text x="920" y="496" font-size="11.5" fill="#0E1E33">· ulimit -n 65535+</text>
    <text x="920" y="518" font-size="11.5" fill="#0E1E33">· Nginx 透传 Upgrade</text>
    <text x="920" y="540" font-size="11.5" fill="#0E1E33">· 多机 Redis Pub/Sub</text>
    <text x="920" y="562" font-size="11.5" fill="#0E1E33">· 关闭码 1008/1009/1013</text>
    <text x="920" y="582" font-size="11.5" fill="#0E1E33">　配监控告警</text>
  </g>

  <!-- 放行章 -->
  <g transform="translate(1090,700)">
    <circle r="46" fill="none" stroke="#DC2626" stroke-width="4"/>
    <circle r="38" fill="none" stroke="#DC2626" stroke-width="2"/>
    <text x="0" y="-6" font-size="17" font-weight="bold" text-anchor="middle" fill="#DC2626" transform="rotate(-12)">上线</text>
    <text x="0" y="18" font-size="17" font-weight="bold" text-anchor="middle" fill="#DC2626" transform="rotate(-12)">放行</text>
  </g>
  <text x="600" y="700" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E1E33">18 项全部打勾，再盖这枚章</text>
  <text x="600" y="728" font-size="13.5" text-anchor="middle" fill="#475569">漫画课堂到此结业 —— 漫画是路标，源码与实测才是路。回到主线 README 继续动手实验吧。</text>
</svg>
